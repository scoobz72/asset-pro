# /etc/nginx/sites-available/assetpro
# The Node app serves both the API and the React build, so everything is proxied.
# Certbot adds the HTTPS parts.
server {
    listen 80;
    listen [::]:80;
    server_name asset-pro.app www.asset-pro.app;

    client_max_body_size 10m;

    # Private until launch: the whole site needs a username and password.
    # Create the login with the command in deploy/README.md (step 6).
    # To go public later, delete these two lines and reload nginx.
    auth_basic "Asset Pro (private)";
    auth_basic_user_file /etc/nginx/assetpro.htpasswd;

    # Let's Encrypt must reach this path without the password
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
